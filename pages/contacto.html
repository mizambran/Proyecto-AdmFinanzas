    <main>
      <h3 class="text-center mt-3 mb-4">Dejanos tu consulta</h3>
      <div class="containerFormulario col-12">
        <form
          id="myForm"
          method="POST"
          class="d-flex flex-column justify-content-center align-items-center"
        >
          <div class="containerFormularioUno">
            <label for="nombre" class="form-label">Nombre:</label><br />
            <input
              type="text"
              id="nombre"
              name="nombre"
              class="form-control"
              required
            /><br />
          </div>
          <div class="containerFormularioDos">
            <label for="email">Email:</label><br />
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              required
            /><br />
          </div>

          <div class="containerFormularioTres">
            <label for="telefono">Celular:</label><br />
            <input
              type="tel"
              id="telefono"
              name="telefono"
              class="form-control"
              required
            /><br />
          </div>

          <div class="containerFormularioCuatro">
            <label for="mensaje">Mensaje:</label><br />
            <textarea
              id="mensaje"
              name="mensaje"
              rows="4"
              class="form-control"
              required
            ></textarea
            ><br />
          </div>

          <button type="submit" class="btn btn-danger">Enviar Mensaje</button>
        </form>
        <div id="status" class="text-center fs-3 mt-3 mb-3"></div>
      </div>
    </main>
