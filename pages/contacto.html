    <main>
        
        <form id="myForm" method="POST">
  <label for="nombre">Nombre:</label><br>
  <input type="text" id="nombre" name="nombre" required><br>
  
  <label for="email">Email:</label><br>
  <input type="email" id="email" name="email" required><br>
  
  <label for="mensaje">Mensaje:</label><br>
  <textarea id="mensaje" name="mensaje" rows="4" required></textarea><br>
  
  <button type="submit">Enviar Mensaje</button>
</form>

<div id="status" style="margin-top: 15px;"></div>

<script>
  const form = document.getElementById('myForm');
  const status = document.getElementById('status');
  
  // Reemplaza 'TU_URL_DE_APPS_SCRIPT' con la URL que copiaste
  const scriptURL = 'https://script.google.com/macros/s/AKfycbzciiGo5j6YFXVt1Ehk63FEan3qkijOZJ8y71X-47Fdk-2ptOpQue6inyLu3oqfsDNr-g/exec';
  
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Muestra un mensaje de carga
    status.textContent = 'Enviando...';
    
    // Envia los datos
    fetch(scriptURL, { method: 'POST', body: new FormData(form)})
      .then(response => response.json())
      .then(data => {
        if (data.result === 'success') {
          status.textContent = data.message;
          status.style.color = 'green';
          form.reset(); // Limpia el formulario
        } else {
          status.textContent = 'Ocurrió un error. Por favor, intenta de nuevo.';
          status.style.color = 'red';
        }
      })
      .catch(error => {
        console.error('Error:', error);
        status.textContent = 'Ocurrió un error en la conexión. Por favor, intenta de nuevo.';
        status.style.color = 'red';
      });
  });
</script>
