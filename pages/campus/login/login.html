    </header>
    <main>
      <div class="iniciarSesion">
        <h3 class="text-center mt-3 mb-4">Iniciar Sesión</h3>
        <div class="container containerFormulario d-flex flex-column justify-content-center align-items-center col-12">
          <form
            action=""
            method="get"
            class=" col-10 col-md-4 col-lg-3"
            id="formularioIniciarSesion"
          >
            <label for="usuario" class="form-label">Usuario</label>
            <input
              type="text"
              placeholder="usuario@gmail.com"
              class="form-control"
              required
              id="usuario"
            />
            <label for="contraseña">Contraseña</label>
            <input
              type="password"
              placeholder="Ingresar contraseña"
              class="form-control"
              required
              id="contraseña"
            />
            <div class="botonesLogin mt-4 mb-5 text-center">
              <button type="submit" class="btn btn-danger">
                Iniciar Sesión
              </button>
            </div>
          </form>
        </div>
      </div>

      <section class="registrarse mt-5 mb-5">
        <div id="containerCrearCuenta">
          
          <div class="container registro-container d-flex flex-column justify-content-center align-items-center">
            <h3 class="text-center mt-3 mb-4">Registrarse</h3>

            <form id="registroForm" class="col-10 col-md-6 col-lg-3">
              <div class="mb-3">
                <label for="emailRegistro" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="emailRegistro"
                  name="email"
                  placeholder="ejemplo@gmail.com"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="passwordRegistro" class="form-label">Contraseña</label>
                <input
                  type="password"
                  class="form-control"
                  id="passwordRegistro"
                  name="password"
                  minlength="8"
                  required
                />
                <div class="form-text">Mínimo 8 caracteres.</div>
              </div>

              <div class="mb-3">
                <label for="confirmPasswordRegistro" class="form-label"
                  >Confirmar Contraseña</label
                >
                <input
                  type="password"
                  class="form-control"
                  id="confirmPasswordRegistro"
                  name="confirmPassword"
                  required
                />
              </div>

              <button type="submit" class="btn btn-danger w-100 mt-3">
                Crear Cuenta
              </button>

              <div id="mensajeEstadoRegistro" class="mt-3 text-center"></div>
            </form>
          </div>
        </div>
      </section>
    </main>
